<div class="grid-container">
    <div *ngFor="let quote of quotes"
         class="quote-card"
         [ngClass]="{'is-confucius': quote.isConfucius}">
        <li>ID: {{quote._id}}</li>
        <li>Quote: {{quote.quote}}</li>
        <li>Author: {{quote.author}}</li>
        <li>Title: {{quote.title}}</li>
        <li>Published: {{quote.published}}</li>
    </div>
</div>
