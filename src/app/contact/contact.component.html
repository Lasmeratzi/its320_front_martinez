<!-- contact.component.html -->
<div id="contact" class="px-6 py-12">
  <h2 class="text-3xl font-bold text-center">Contact Me</h2>
  <p class="mt-4 text-center text-lg">I'd love to hear from you! Whether you have a question, want to collaborate, or just want to say hello, feel free to reach out.</p>
  <div class="mt-8 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8"> <!-- Adjusted to a 2-column grid layout -->
    <!-- Left Column -->
    <div>
      <form>
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Your Name</label>
          <input type="text" id="name" class="w-full px-4 py-2 mt-2 border rounded-md bg-white bg-opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Enter your name" />
        </div>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Your Email</label>
          <input type="email" id="email" class="w-full px-4 py-2 mt-2 border rounded-md bg-white bg-opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Enter your email" />
        </div>
      </form>
    </div>
    <!-- Right Column -->
    <div>
      <form>
        <div class="mb-4">
          <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
          <textarea id="message" rows="6" class="w-full px-4 py-2 mt-2 border rounded-md bg-white bg-opacity-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" placeholder="Write your message"></textarea>
        </div>
        <div class="flex justify-center">
          <button type="submit" class="bg-black hover:bg-gray-800 text-white px-6 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:ring-opacity-50 transition duration-300">Send Message</button>
        </div>
      </form>
    </div>
  </div>
</div>
